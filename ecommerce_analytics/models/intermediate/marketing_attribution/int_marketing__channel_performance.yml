# models/intermediate/marketing_attribution/int_marketing__channel_performance.yml
version: 2

models:
  - name: int_marketing__channel_performance
    description: |
      Intermediate model unifying web session analytics and paid advertising metrics at the daily channel level.
      
      ### Core Architecture
      - **Source models:** `stg_google_analytics__sessions` and `stg_facebook_ads__ad_performance`
      - **Join strategy:** LEFT JOIN sessions to ads on (date + paid channel)
      - **Grain:** One row per (activity_date, traffic_channel)
      - **Primary Key:** Composite (activity_date, traffic_channel)
      
      ### Design Decisions
      
      1. **Asymmetric LEFT JOIN (Critical):**
         Preserves all organic traffic channels even when no ad spend is present. 
         *Risk:* If GA tracking breaks but ads keep spending, ad spend is orphaned. 
         *Mitigation:* Singular test `assert_ad_spend_matches_staging.sql` actively monitors for dropped financial data.
      
      2. **Configurable Channel Mapping:**
         Paid channel name is abstracted via `var('paid_channel_name')`.
         Default is 'paid_advertising'. To test alternate definitions without altering code:
         `dbt run --vars '{paid_channel_name: "paid_social"}'`
      
      3. **Explicit NULL Semantics:**
         Ad metrics (impressions, clicks, spend, CTR, CPC, CPA) are `NULL` for non-paid channels. This is INTENTIONAL, not a bug. Only the `{{ var('paid_channel_name') }}` channel receives blended spend.
      
      4. **Pre-Join Aggregation (Simpson's Paradox Prevention):**
         Both sources are aggregated BEFORE the join (not after). Sessions are grouped by date + channel; Ads are rolled up globally by date. This mathematically guarantees blended metrics use the safe `sum/sum` method rather than averaging pre-calculated rates.
      
      ### Testing Strategy & Data Contracts
      
      Deployed a 13-test observability matrix:
      - **Model-level (6):** Cross-column reality checks (clicks ≤ impressions, bounces ≤ sessions), business rules (spend exclusively on paid channel), and composite PK uniqueness.
      - **Column-level (6):** Non-null constraints and mathematical boundaries (bounce rate 0.0 to 1.0).
      - **Singular (1):** Financial reconciliation (orphan spend detection).
      
      **Compute Optimization:**
      Applied DRY testing principles by pruning 1 redundant `accepted_values` test. Traffic channel boundaries are validated at the point of origin (staging) to save warehouse compute.
      
      ### Downstream Consumers
      - `fct_marketing_performance` (Marts layer)
      - Any mart analyzing multi-channel top-of-funnel attribution.
    
    config:
      tags: ['intermediate', 'marketing_attribution', 'daily']
          
    tests:
      # Composite PK
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - activity_date
            - traffic_channel
          config:
            severity: error

      # Cross-column reality check: Ad clicks cannot exceed impressions
      - dbt_utils.expression_is_true:
          name: clicks_cannot_exceed_impressions
          expression: >
            total_ad_clicks <= total_impressions 
            or total_ad_clicks is null 
            or total_impressions is null
          config:
            severity: error

      # Cross-column reality check: Bounced sessions cannot exceed total sessions
      - dbt_utils.expression_is_true:
          name: bounces_cannot_exceed_sessions
          expression: "bounced_sessions <= total_sessions"
          config:
            severity: error

      # Cross-column reality check: Engaged sessions cannot exceed total sessions
      - dbt_utils.expression_is_true:
          name: engaged_cannot_exceed_sessions
          expression: "engaged_sessions <= total_sessions"
          config:
            severity: error

      # Business logic: Spend should only exist for paid channel
      - dbt_utils.expression_is_true:
          name: spend_only_on_paid_channel
          expression: >
            (traffic_channel = '{{ var("paid_channel_name") }}' and total_spend is not null)
            or (traffic_channel != '{{ var("paid_channel_name") }}' and total_spend is null)
          config:
            severity: warn

      # Bounce rate must be between 0 and 1
      - dbt_utils.expression_is_true:
          name: bounce_rate_valid_range
          expression: "bounce_rate between 0 and 1 or bounce_rate is null"
          config:
            severity: error

    columns:
      - name: activity_date
        description: Date of activity (session date or ad performance date)
        tests:
          - not_null

      - name: traffic_channel
        description: "{{ doc('marketing_traffic_channels') }}"
        tests:
          - not_null
        # NO accepted_values test - validated in stg_google_analytics__sessions
        
      - name: is_paid_channel
        description: True for paid_advertising channel only
        tests:
          - not_null
          - accepted_values:
              values: [true, false]

      - name: total_sessions
        description: "{{ doc('ga_total_sessions') }}"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "> 0"

      - name: bounce_rate
        description: "{{ doc('ga_bounce_rate') }}"
        tests:
          - not_null

      - name: total_spend
        description: "{{ doc('fb_total_spend') }}"
        # NO tests - NULL for non-paid channels (intentional)
          

      - name: blended_cpa
        description: >
          Blended cost per acquisition: total_spend / total_conversions.
          NULL for non-paid channels or when conversions = 0.