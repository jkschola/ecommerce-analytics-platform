# models/intermediate/marketing_attribution/int_marketing__channel_performance.yml
version: 2

models:
  - name: int_marketing__channel_performance
    description: |
      Intermediate model unifying web session analytics and paid advertising metrics at the daily channel level.
      
      ### Source & Grain
      - **Source models:** `stg_google_analytics__sessions` and `stg_facebook_ads__ad_performance`
      - **Join strategy:** FULL OUTER JOIN (sessions ⟗ ads)
      - **Grain:** One row per (activity_date, traffic_channel) for REAL events only.
      - **Primary Key:** Composite (activity_date, traffic_channel)
      
      ### Critical Design Decision — Why FULL OUTER JOIN?
      We use a FULL OUTER JOIN (rather than a LEFT JOIN or a Date Spine) to preserve all events from BOTH data sources:
      1. **Days with sessions only:** Organic traffic days (ads = NULL).
      2. **Days with ads only:** Ads ran but got 0 clicks, meaning 0 sessions (sessions = 0).
      3. **Days with both:** Normal operating days (all columns populated).
      
      **Why not LEFT JOIN (sessions → ads)?**
      - *Risk:* Would silently drop days with ad spend but 0 paid sessions.
      - *History:* Lost €8,706.44 across 63 days before the fix.
      - *Safeguard:* Actively monitored by the `assert_ad_spend_matches_staging` test.
      
      **Why not a Date Spine (dates × channels)?**
      - *Risk:* Warehouse compute bloat.
      - *Explanation:* A spine creates artificial rows (e.g., 730 days × 6 channels = 4,380 rows). If a specific channel had zero activity on Christmas, a spine forces a row of fake zeros. Spine generation belongs in the BI/reporting layer, not the intermediate transformation layer.
      
      ### Defensive COALESCE Strategy
      ```sql
      coalesce(s.activity_date, a.activity_date)    -- Prevents NULL primary keys
      coalesce(s.total_sessions, 0)                 -- Zero mathematically represents "no sessions"
      s.bounce_rate                                 -- Preserved as NULL when sessions = 0 (prevents 0/0 division)
      a.total_spend                                 -- Preserved as NULL for non-paid channels (intentional)
      ```
      
      ### Valid Data States
      | Scenario | total_sessions | total_spend | Business Meaning |
      |----------|---------------|-------------|---------|
      | Organic traffic day | 1,000 | NULL | Organic traffic occurred; no ads ran. |
      | Ad-only day | 0 | €500 | Ads ran and spent money, but generated 0 sessions. |
      | Blended day | 1,000 | €500 | Both platforms recorded activity. |
      
      ### Testing Strategy
      - **Spend preservation:** `assert_ad_spend_matches_staging` (singular test).
      - **Cross-column reality:** Clicks ≤ impressions, bounces ≤ sessions.
      - **Business rules:** Spend strictly isolated to the paid channel.
      - **Zero-session validation:** `total_sessions = 0` is recognized as VALID (removed `> 0` constraint).
      - **Total tests:** 13 (6 model + 6 column + 1 singular).
    
    config:
      tags: ['intermediate', 'marketing_attribution', 'daily']      

    tests:
      # Composite PK
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - activity_date
            - traffic_channel
          config:
            severity: error

      # Cross-column reality check: Ad clicks cannot exceed impressions
      - dbt_utils.expression_is_true:
          name: clicks_cannot_exceed_impressions
          expression: >
            total_ad_clicks <= total_impressions 
            or total_ad_clicks is null 
            or total_impressions is null
          config:
            severity: error

      # Cross-column reality check: Bounced sessions cannot exceed total sessions
      - dbt_utils.expression_is_true:
          name: bounces_cannot_exceed_sessions
          expression: "bounced_sessions <= total_sessions"
          config:
            severity: error

      # Cross-column reality check: Engaged sessions cannot exceed total sessions
      - dbt_utils.expression_is_true:
          name: engaged_cannot_exceed_sessions
          expression: "engaged_sessions <= total_sessions"
          config:
            severity: error

      # Business logic: Spend should only exist for paid channel
      - dbt_utils.expression_is_true:
          name: spend_only_on_paid_channel
          expression: >
            (traffic_channel = '{{ var("paid_channel_name") }}' and total_spend is not null)
            or (traffic_channel != '{{ var("paid_channel_name") }}' and total_spend is null)
          config:
            severity: warn

      # Bounce rate must be between 0 and 1
      - dbt_utils.expression_is_true:
          name: bounce_rate_valid_range
          expression: "bounce_rate between 0 and 1 or bounce_rate is null"
          config:
            severity: error

    columns:
      - name: activity_date
        description: Date of activity (session date or ad performance date)
        tests:
          - not_null

      - name: traffic_channel
        description: "{{ doc('marketing_traffic_channels') }}"
        tests:
          - not_null
        # NO accepted_values test - validated in stg_google_analytics__sessions
        
      - name: is_paid_channel
        description: True for paid_advertising channel only
        tests:
          - not_null
          - accepted_values:
              values: [true, false]

      - name: total_sessions
        description: "{{ doc('ga_total_sessions') }}"
        tests:
          - not_null
          # REMOVED: expression > 0
          # Reason: Zero is now valid for ad-only days (days with spend but no sessions)

      - name: bounce_rate
        description: "{{ doc('ga_bounce_rate') }}"
          # REMOVED tests: not_null
          # keep NULL when no sessions (can't calculate bounce_rate when sessions = 0 (avoid 0/0)

      - name: total_spend
        description: "{{ doc('fb_total_spend') }}"
        # NO tests - NULL for non-paid channels (intentional)
          

      - name: blended_cpa
        description: >
          Blended cost per acquisition: total_spend / total_conversions.
          NULL for non-paid channels or when conversions = 0.