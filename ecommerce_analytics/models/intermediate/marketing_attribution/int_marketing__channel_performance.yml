# models/intermediate/marketing_attribution/int_marketing__channel_performance.yml
version: 2

models:
  - name: int_marketing__channel_performance
    description: >
      Intermediate model unifying web session analytics and paid advertising
      metrics at the daily channel level.
      
      **Source models:**
      - stg_google_analytics__sessions (aggregated)
      - stg_facebook_ads__ad_performance (aggregated, left joined)
      
      **Join type:** LEFT JOIN sessions to ads on (date + paid_advertising)
      
      **Grain:** One row per (activity_date, traffic_channel)
      
      **Primary Key:** (activity_date, traffic_channel)
      
      **Design Decision — LEFT JOIN:**
      We LEFT JOIN ads onto sessions to preserve all organic traffic channels.
      However, this creates risk: if GA tracking fails but ads are still
      spending, that spend will be orphaned (not appear in this model).
      This is monitored via assert_ad_spend_matches_staging singular test.
      
      **Important Note on NULL Ad Metrics:**
      total_impressions, total_spend, blended_ctr, blended_cpc, blended_cpa
      are NULL for all non-paid channels. This is intentional and correct.
      Only paid_advertising channel has corresponding Facebook Ads data.
    
    config:
      tags: ['intermediate', 'marketing_attribution', 'daily']
    
    tests:
      # Composite PK
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - activity_date
            - traffic_channel
          config:
            severity: error

      # Cross-column reality check: Ad clicks cannot exceed impressions
      - dbt_utils.expression_is_true:
          name: clicks_cannot_exceed_impressions
          expression: >
            total_ad_clicks <= total_impressions 
            or total_ad_clicks is null 
            or total_impressions is null
          config:
            severity: error

      # Cross-column reality check: Bounced sessions cannot exceed total sessions
      - dbt_utils.expression_is_true:
          name: bounces_cannot_exceed_sessions
          expression: "bounced_sessions <= total_sessions"
          config:
            severity: error

      # Cross-column reality check: Engaged sessions cannot exceed total sessions
      - dbt_utils.expression_is_true:
          name: engaged_cannot_exceed_sessions
          expression: "engaged_sessions <= total_sessions"
          config:
            severity: error

      # Business logic: Spend should only exist for paid channel
      - dbt_utils.expression_is_true:
          name: spend_only_on_paid_channel
          expression: >
            (traffic_channel = '{{ var("paid_channel_name") }}' and total_spend is not null)
            or (traffic_channel != '{{ var("paid_channel_name") }}' and total_spend is null)
          config:
            severity: warn

      # Bounce rate must be between 0 and 1
      - dbt_utils.expression_is_true:
          name: bounce_rate_valid_range
          expression: "bounce_rate between 0 and 1 or bounce_rate is null"
          config:
            severity: error

    columns:
      - name: activity_date
        description: Date of activity (session date or ad performance date)
        tests:
          - not_null

      - name: traffic_channel
        description: Standardized traffic channel from GA sessions
        tests:
          - not_null
          - accepted_values:
              values: ['organic_search', 'paid_advertising', 'direct_traffic',
                       'referral_traffic', 'social_media', 'other']
              quote: true

      - name: is_paid_channel
        description: True for paid_advertising channel only
        tests:
          - not_null
          - accepted_values:
              values: [true, false]

      - name: total_sessions
        description: Total GA sessions for this channel on this date
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "> 0"

      - name: bounce_rate
        description: Bounced sessions / total sessions (0 to 1)
        tests:
          - not_null

      - name: total_spend
        description: >
          Total Facebook Ads spend in EUR.
          NULL for all non-paid channels — this is intentional.

      - name: blended_cpa
        description: >
          Blended cost per acquisition: total_spend / total_conversions.
          NULL for non-paid channels or when conversions = 0.