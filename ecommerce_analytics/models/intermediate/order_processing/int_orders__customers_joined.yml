# models/intermediate/order_processing/int_orders__customers_joined.yml
version: 2

models:
  - name: int_orders__customers_joined
    description: >
      Intermediate model enriching orders with customer attributes.
      
      **Source models:**
      - stg_shopify__orders
      - stg_shopify__customers
      
      **Join type:** INNER JOIN on customer_id
      
      **Grain:** One row per order_id
      
      **Primary Key:** order_id
      
      **Purpose:** Single reusable model providing order + customer context.
      Consumed by fct_orders and any mart needing customer-sliced order analysis.
      Eliminates repeated join logic across multiple marts (DRY principle).
      
      **Design Decision — Why INNER JOIN:**
      We intentionally use INNER JOIN (not LEFT JOIN). All orders must have
      a valid customer_id (enforced by FK test in stg_shopify__orders).
      If row count drops below 25,000, it signals orphaned orders in source data.
    
    config:
      tags: ['intermediate', 'order_processing', 'daily']
    
    # Model-level cross-column logic tests
    tests:
      # Validates mathematical consistency between derived columns
      - dbt_utils.expression_is_true:
          name: new_customer_flag_matches_tenure_logic
          expression: >
            (days_from_signup_to_order <= 30 and is_new_customer_order = true)
            or (days_from_signup_to_order > 30 and is_new_customer_order = false)
          config:
            severity: error
            error_if: ">0"

    columns:
      - name: order_id
        description: Primary key. Unique order identifier from Shopify.
        tests:
          - unique      # Validates the JOIN didn't cause a fan-out
          - not_null

      - name: customer_id
        description: Foreign key to customers. Every order has a valid customer.
        tests:
          - not_null

      - name: customer_full_name
        description: Customer full name from stg_shopify__customers
        
      - name: customer_country
        description: Customer country from Shopify profile. Validated in stg_shopify__customers.
        # NO TESTS - pass-through from staging

      - name: order_status
        description: Current order status
        # NO TESTS - pass-through from staging

      - name: revenue
        description: Revenue for completed orders, 0 otherwise
        # NO TESTS - pass-through from staging

      - name: days_from_signup_to_order
        description: >
          Days between customer account creation and order placement.
          0 = ordered on signup day.
          Enables new customer cohort analysis.
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"
              config:
                severity: error

      - name: is_new_customer_order
        description: >
          True when order placed within 30 days of customer signup.
          Identifies first-time buyer behavior for acquisition analysis.
        tests:
          - not_null
          - accepted_values:
              values: [true, false]