name: 'ecommerce_analytics'
version: '1.0.0'
config-version: 2

profile: 'ecommerce_analytics'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  #- "dbt_packages"

models:
  ecommerce_analytics:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

# Temporarily remove vars and hooks to find the error
vars:
  start_date: '2023-01-01'
  end_date: '2024-12-31'

  # Reference date for recency calculations
  # In PROD: use current_timestamp()
  # In DEV: use end of data range to make demo realistic
  recency_reference_date: '2024-12-31'  
  
  # Default currency
  default_currency: 'EUR'

  # Customer acquisition threshold (in days)
  new_customer_window_days: 30 

  # Spend reconciliation tolerance (in currency units)
  # Allows for floating-point rounding in aggregations
  spend_variance_tolerance: 0.01

  # ----------------------------------------
  # Marketing Channel Taxonomy Configuration
  # ----------------------------------------
  
  # 1. Output channel names (what the business sees)
  channel_organic: 'organic_search'
  paid_channel_name: 'paid_advertising'  # Keeping our existing var for intermediate compatibility
  channel_direct: 'direct_traffic'
  channel_referral: 'referral_traffic'
  channel_social: 'social_media'
  channel_other: 'other'

  # 2. Input source mappings (raw UTM values -> channels)
  source_mapping_organic: ['organic', 'seo']
  source_mapping_paid: ['paid', 'cpc', 'ppc', 'adwords']
  source_mapping_direct: ['direct', '(direct)']
  source_mapping_referral: ['referral']
  source_mapping_social: ['social', 'facebook', 'instagram', 'linkedin', 'twitter']